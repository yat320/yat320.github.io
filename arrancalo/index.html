<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<title>Arrancalo</title>
<style>
  :root {
    --fondo: #1b1a17; --tarjeta: #2a2824; --borde: #3d3a34; --texto: #f2ede3; --suave: #b3ab9c;
    --acento: #f2b33d; --bien: #4cc46a; --mal: #ff4d3d;
    --rojo: #e23b2e; --azul: #2f6fe0; --amarillo: #f5c518; --blanco: #f4f1ea; --negro: #0d0d0d;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent }
  body { min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left) }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; touch-action: manipulation }
  .pantalla { max-width: 760px; margin: 0 auto; padding: 16px }
  [hidden] { display: none !important }

  /* inicio */
  .titulo { font-size: 44px; font-weight: 900; letter-spacing: -1px; margin: 24px 0 4px; color: var(--acento) }
  .bajada { color: var(--suave); margin: 0 0 24px }
  .rol { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 18px; padding: 18px; margin-bottom: 14px }
  .rol:active { border-color: var(--acento) }
  .rol .ico { font-size: 44px }
  .rol b { display: block; font-size: 22px }
  .rol span { color: var(--suave); font-size: 15px }
  .como { background: var(--tarjeta); border-radius: 14px; padding: 4px 16px; color: var(--suave); font-size: 15px; margin-top: 20px }
  .numeros { color: var(--suave); font-size: 14px; text-align: center; margin-top: 18px }

  /* elegir nivel */
  .niveles { display: grid; gap: 12px; margin: 16px 0 }
  .nivel { background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 14px; padding: 14px 16px; text-align: left }
  .nivel.elegido { border-color: var(--acento) }
  .nivel b { font-size: 20px } .nivel span { color: var(--suave); display: block; font-size: 15px }
  .grande { width: 100%; background: var(--acento); color: #1b1a17; font-weight: 800; font-size: 22px; border-radius: 16px; padding: 18px; margin-top: 8px }
  .chico { background: none; color: var(--suave); text-decoration: underline; padding: 12px; width: 100% }

  /* partida */
  .barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fondo); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--borde) }
  .reloj { font: 800 34px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; min-width: 96px }
  .reloj.apuro { color: var(--mal) }
  .errores { display: flex; gap: 6px }
  .errores i { width: 18px; height: 18px; border-radius: 50%; background: var(--borde); display: block }
  .errores i.on { background: var(--mal); box-shadow: 0 0 10px var(--mal) }
  .patente { margin-left: auto; background: #fff; color: #111; border: 2px solid #111; border-top: 7px solid #1e4fa8; border-radius: 6px; padding: 1px 8px; font: 800 17px/1.2 ui-monospace, Menlo, Consolas, monospace; white-space: nowrap }
  .x { background: none; color: var(--suave); font-size: 22px; padding: 4px 6px; white-space: nowrap }
  .x[data-seguro] { color: var(--mal); font-size: 16px }
  .modulos { display: grid; gap: 14px; padding: 16px; max-width: 900px; margin: 0 auto }
  @media (min-width: 720px) { .modulos { grid-template-columns: 1fr 1fr } }
  .modulo { background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 18px; padding: 14px; position: relative }
  .modulo h2 { margin: 0 0 12px; font-size: 18px; display: flex; align-items: center; gap: 8px }
  .modulo h2 .luz { width: 14px; height: 14px; border-radius: 50%; background: var(--borde) }
  .modulo.listo { border-color: var(--bien) }
  .modulo.listo h2 .luz { background: var(--bien); box-shadow: 0 0 10px var(--bien) }
  .modulo.listo .tapa { position: absolute; inset: 0; border-radius: 16px; background: rgba(27,26,23,.55); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--bien) }
  .modulo.mal { animation: sacudir .35s; border-color: var(--mal) }
  @keyframes sacudir { 25% { transform: translateX(-8px) } 50% { transform: translateX(8px) } 75% { transform: translateX(-4px) } }

  .cables { display: grid; gap: 12px; padding: 4px 0 }
  .cable { height: 30px; border-radius: 15px; position: relative; border: 2px solid rgba(255,255,255,.15) }
  .cable.cortado { background: transparent !important; border: 0 }
  .cable.cortado::before, .cable.cortado::after { content: ''; position: absolute; top: 0; bottom: 0; width: 42%; border-radius: 15px; background: var(--c) }
  .cable.cortado::before { left: 0 } .cable.cortado::after { right: 0 }
  .c-rojo { --c: var(--rojo); background: var(--rojo) } .c-azul { --c: var(--azul); background: var(--azul) }
  .c-amarillo { --c: var(--amarillo); background: var(--amarillo) } .c-blanco { --c: var(--blanco); background: var(--blanco) }
  .c-negro { --c: var(--negro); background: var(--negro); border-color: #555 }

  .fusibles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
  .fusible { font-size: 52px; line-height: 1; padding: 16px 0; border-radius: 14px; background: #3a372f; border: 2px solid var(--borde) }
  .fusible.sacado { opacity: .3; border-color: var(--bien) }

  .lampara { width: 110px; height: 110px; border-radius: 50%; margin: 4px auto 16px; background: #3a372f; border: 4px solid #111; transition: background .05s }
  .lampara.on.amarillo { background: var(--amarillo); box-shadow: 0 0 40px var(--amarillo) }
  .lampara.on.rojo { background: var(--rojo); box-shadow: 0 0 40px var(--rojo) }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
  .opcion { background: #3a372f; border: 2px solid var(--borde); border-radius: 12px; padding: 14px 8px; font-weight: 700 }
  .opcion:active, .fusible:active { border-color: var(--acento) }

  .llave { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0 }
  .boton { width: 150px; height: 150px; border-radius: 50%; font-weight: 900; font-size: 20px; border: 6px solid rgba(0,0,0,.35); box-shadow: 0 6px 0 rgba(0,0,0,.45); user-select: none; -webkit-user-select: none; touch-action: none }
  .boton.apretado { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.45) }
  .boton.c-blanco, .boton.c-amarillo { color: #1b1a17 } .boton.c-rojo, .boton.c-azul { color: #fff }
  .tira { width: 22px; height: 150px; border-radius: 11px; background: #3a372f; border: 2px solid #111 }

  .ruido { text-align: center; font: 900 40px/1.1 system-ui, sans-serif; letter-spacing: 1px; margin: 6px 0 4px; color: var(--acento); word-break: break-word }
  .ronda { text-align: center; color: var(--suave); font-size: 14px; margin-bottom: 12px }
  .acciones { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px }
  .acciones .opcion { padding: 14px 4px; font-size: 15px }

  /* fin */
  .fin { position: fixed; inset: 0; z-index: 10; background: rgba(15,14,12,.94); overflow: auto }
  .fin .pantalla { padding-top: 40px; text-align: center }
  .fin h1 { font-size: 46px; margin: 10px 0 }
  .fin .sub { color: var(--suave); font-size: 18px }
  .respuestas { text-align: left; background: var(--tarjeta); border-radius: 14px; padding: 8px 16px; margin: 20px 0; font-size: 15px }
  .respuestas li { margin: 6px 0 }
  .temblor { animation: temblor .6s }
  @keyframes temblor { 20% { transform: translate(-10px, 4px) } 40% { transform: translate(10px, -4px) } 60% { transform: translate(-6px, 2px) } 80% { transform: translate(6px, 0) } }
  .cuenta { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; font-size: 140px; font-weight: 900; color: var(--acento); background: rgba(15,14,12,.9) }

  /* manual */
  .pestanas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fondo); display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--borde); scrollbar-width: none }
  .pestana { flex: none; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 700; white-space: nowrap }
  .pestana.activa { border-color: var(--acento); color: var(--acento) }
  .hoja { background: #f4efe4; color: #1d1b17; border-radius: 6px; padding: 18px; margin: 16px 0; box-shadow: 0 2px 0 #c9bfa9 }
  .hoja h2 { margin: 0 0 10px; font-size: 26px; border-bottom: 3px solid #1d1b17; padding-bottom: 6px }
  .hoja h3 { margin: 18px 0 4px; font-size: 19px }
  .hoja .nota { background: #fff7d6; border-left: 4px solid #e0a800; padding: 6px 10px }
  .reglas { padding-left: 24px; margin: 6px 0 } .reglas li { margin: 6px 0 }
  .tabla { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 16px }
  .tabla th, .tabla td { border: 1px solid #b8ad95; padding: 7px 8px; text-align: left }
  .tabla th { background: #e6dcc6 }
  .tabla .ruido { font-weight: 900; letter-spacing: .5px; text-align: left; color: inherit; font-size: 18px }
  .patron i { font-style: normal; display: inline-block; margin: 1px 0 }
  .patron .corto { font-size: 13px } .patron .largo { font-weight: 900 }
  .columnas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px }
  .columna { display: flex; flex-direction: column; align-items: center; gap: 4px; background: #e6dcc6; border-radius: 6px; padding: 6px 0; font-size: 30px; line-height: 1.15 }
  .columna b { font-size: 16px }
  @media (max-width: 380px) { .columna { font-size: 25px } }
  .pie { display: flex; gap: 10px; justify-content: center; padding-bottom: 30px }
  .pie .chico { width: auto }

  /* el auto en el visor */
  .vr { position: fixed; inset: 0; z-index: 30; background: #24221e }
  .vr canvas { display: block }

  @media print {
    body { background: #fff } .pestanas, .pie, .no-imprimir { display: none !important }
    .pantalla { max-width: none; padding: 0 } .hoja { box-shadow: none; break-inside: avoid; page-break-inside: avoid; background: #fff }
  }
</style>
</head>

      <p>Tu compa\xF1ero tiene el auto roto y <b>no ve este manual</b>. Vos <b>no ves el auto</b>. \xC9l te cuenta qu\xE9 ve, vos busc\xE1s la regla y le dec\xEDs qu\xE9 hacer.</p>
      <p>Cada falla tiene su p\xE1gina: tocala arriba cuando te diga cu\xE1l le toc\xF3.</p>
      <p>Tres errores y <b>se funde el motor</b>. Si se acaba el reloj, tambi\xE9n.</p>
      <p class="nota">Las reglas se leen <b>en orden</b>: hac\xE9 la primera que se cumpla y no sigas leyendo.</p>
      <p class="nota">Varias reglas preguntan por la <b>patente</b> (AB 123 CD). Ped\xEDsela al principio.</p>`},cables:{titulo:Xt.cables,html:`
      <p>Hay de 3 a 6 cables. Hay que <b>desenchufar uno solo</b>. Se cuentan <b>de arriba para abajo</b>.</p>
      <h3>Si hay 3 cables</h3>
      ${as(["Si hay <b>un solo negro</b>: desenchuf\xE1 el negro.","Si los tres son de <b>distinto color</b>: el del medio.","Si el primero y el \xFAltimo son del <b>mismo color</b>: el \xFAltimo.","Si no: el primero."])}
      <h3>Si hay 4 cables</h3>
      ${as(["Si hay <b>m\xE1s azules que rojos</b>: el \xFAltimo azul.","Si el \xFAltimo n\xFAmero de la patente es <b>par</b> (el 0 es par): el tercero.","Si hay alg\xFAn <b>amarillo</b>: el primer amarillo.","Si no: el segundo."])}
      <h3>Si hay 5 cables</h3>
      ${as(["Si <b>no hay blancos</b>: el cuarto.","Si hay <b>exactamente dos rojos</b>: el segundo rojo.","Si la patente tiene una <b>vocal</b> (A, E, I, O, U): el primero.","Si no: el \xFAltimo."])}
      <h3>Si hay 6 cables</h3>
      ${as(["Si el primero es <b>amarillo</b>: el sexto.","Si hay <b>un solo negro</b>: el que est\xE1 justo debajo del negro (si el negro es el \xFAltimo, el primero).","Si el \xFAltimo n\xFAmero de la patente es <b>impar</b>: el quinto.","Si no: el tercero."])}`},fusibles:{titulo:Xt.fusibles,html:`
      <p>Hay 4 fusibles con dibujitos. Los 4 est\xE1n juntos en <b>una sola</b> de estas columnas. Buscala y sacalos <b>en el orden de la columna, de arriba para abajo</b>.</p>
      <p class="nota">Si saca uno equivocado es un error, pero los que ya sac\xF3 bien quedan sacados.</p>
      <div class="columnas">${$n.map((i,e)=>`<div class="columna"><b>${e+1}</b>${i.map(t=>`<span>${t}</span>`).join("")}</div>`).join("")}</div>`},testigo:{titulo:Xt.testigo,html:`
      <p>Una luz parpadea siempre igual: tres destellos, cortos o largos, y una pausa. Pregunt\xE1 de qu\xE9 <b>color</b> es y c\xF3mo parpadea. Decile qu\xE9 parte tocar.</p>
      <table class="tabla"><thead><tr><th>Parpadeo</th><th>Luz amarilla</th><th>Luz roja</th></tr></thead><tbody>
      ${ns.map(([i,e,t])=>`<tr><td class="patron">${[...i].map(n=>n==="C"?'<i class="corto">corto</i>':'<i class="largo">LARGO</i>').join(" ")}</td><td>${e}</td><td>${t}</td></tr>`).join("")}
      </tbody></table>`},llave:{titulo:Xt.llave,html:`
      <p>Hay un bot\xF3n grande de color con una palabra. Hay que <b>tocarlo y soltarlo enseguida</b> o <b>mantenerlo apretado</b>.</p>
      ${as(["Si es <b>rojo</b> y dice <b>MOTOR</b>: tocar y soltar.","Si dice <b>ARRANCAR</b> y la patente tiene una <b>vocal</b>: mantener.","Si es <b>blanco</b>: tocar y soltar.","Si es <b>azul</b> y dice <b>CONTACTO</b>: mantener.","Si es <b>amarillo</b>: mantener.","Si no: tocar y soltar."])}
