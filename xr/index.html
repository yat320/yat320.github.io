<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#1b1a17">
<title>Probá en el Quest</title>
<style>
  :root { --fondo: #1b1a17; --tarjeta: #2a2824; --borde: #3d3a34; --texto: #f2ede3; --suave: #b3ab9c; --acento: #f2b33d; --mal: #ff4d3d }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
  button { font: inherit; color: inherit; cursor: pointer; border: 0 }
  .pantalla { max-width: 760px; margin: 0 auto; padding: 16px }
  .titulo { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin: 20px 0 4px; color: var(--acento) }
  .bajada { color: var(--suave); margin: 0 0 20px }
  .exp { background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px }
  .exp .cab { display: flex; align-items: center; gap: 12px; font-size: 23px }
  .exp .ico { font-size: 34px }
  .exp p { color: var(--suave); margin: 8px 0 12px }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
  .grande { background: var(--acento); color: var(--fondo); font-weight: 800; font-size: 20px; border-radius: 14px; padding: 14px 22px }
  .chico { background: none; color: var(--suave); text-decoration: underline; padding: 12px }
  .error { background: #3a1d1a; border: 2px solid var(--mal); border-radius: 12px; padding: 10px 14px; margin: 16px }
  .vr { position: fixed; inset: 0; z-index: 30; background: #24221e }
  .vr canvas { display: block }
</style>
