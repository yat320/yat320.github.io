<!doctype html><html><head><meta charset=utf8>
<meta name="robots" content="noindex">
<!-- Copia del artifact https://claude.ai/artifact/NLAfhfq6QS1RGFiy8ckS7t (26/10/2026). Para actualizarla, ver el CLAUDE.md de la raíz. --><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marea de Noche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: canvas a pantalla completa; barra de luz arriba, texto mínimo abajo */
:root{
  --deep:#03141a; --glow:#7ef0d4; --moon:#e8e2c9; --dim:#5d8a8a;
  --display:"Fraunces", Georgia, serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--deep);overflow:hidden}
body{color:var(--moon);font-family:var(--mono);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
.row b{font-weight:400;color:var(--glow)}
.bar{margin-top:8px;height:2px;background:color-mix(in srgb,var(--dim) 30%,transparent);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--glow);box-shadow:0 0 8px var(--glow);transition:width .4s}
.hud{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.hud h1{margin:0;font:300 22px/1.1 var(--display);color:var(--moon);opacity:.85}
.hud p{margin:4px 0 0;font-size:11px;letter-spacing:.06em;color:var(--dim);max-width:30ch;line-height:1.5}
button{pointer-events:auto;font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--glow);background:transparent;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);
  border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  opacity:0;transition:opacity 1.6s;width:min(86vw,420px)}
.toast.on{opacity:1}
.toast h2{margin:0;font:300 30px/1.15 var(--display);color:var(--moon);text-wrap:balance}
.toast p{margin:10px 0 0;font-size:12px;letter-spacing:.05em;color:var(--glow);line-height:1.6}
</style>

<canvas id="c"></canvas>
<div class="top">
  <div class="row"><span id="stageName">Plancton</span><span><b id="light">0</b> luz · <span id="next">medusas a 60</span></span></div>
  <div class="bar"><i id="fill"></i></div>
</div>
<div class="toast" id="toast"><h2 id="tT"></h2><p id="tP"></p></div>
<div class="hud">
  <div id="intro">
    <h1>Marea de noche</h1>
    <p id="hint">Tocá el agua. Donde dos ondas se cruzan, la luz se multiplica.</p>
  </div>
  <button id="snd" type="button">Sonido: no</button>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,D=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
size();addEventListener('resize',size);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);

// ---------- progreso ----------
const STAGES=[
 {at:0,   name:'Plancton', hint:'Tocá el agua. Donde dos ondas se cruzan, la luz se multiplica.'},
 {at:60,  name:'Medusas',  hint:'Tocá una medusa o pasale una onda: late y suelta luz.', t:'Llegaron las medusas', p:'Tocalas o alcanzalas con una onda.'},
 {at:200, name:'Cardumen', hint:'Mantené apretado: el cardumen sigue tu dedo y se enciende al cruzar ondas.', t:'Un cardumen te sigue', p:'Mantené el dedo apoyado y guialo por las ondas.'},
 {at:450, name:'Tortuga',  hint:'A veces cruza una tortuga. Tocala antes de que se vaya.', t:'Pasa una tortuga', p:'Cruza cada tanto. Tocala para un regalo grande.'},
 {at:800, name:'Aurora',   hint:'El mar cambia de color de a poco. Seguí jugando lo que quieras.', t:'Aurora sobre el mar', p:'El agua cambia de color despacio. Ya no hay apuro.'},
 {at:1500,name:'Mar abierto',hint:'Todo está despierto. Quedate el tiempo que quieras.', t:'Mar abierto', p:'Todo despierto. Quedate el tiempo que quieras.'}
];
let light=0,stage=0;
try{const s=JSON.parse(localStorage.getItem('marea')||'{}');light=s.light||0}catch(_){}
function stageFor(l){let s=0;STAGES.forEach((x,i)=>{if(l>=x.at)s=i});return s}
stage=stageFor(light);
function save(){try{localStorage.setItem('marea',JSON.stringify({light:Math.floor(light)}))}catch(_){}}
function hud(){
  $('light').textContent=Math.floor(light);$('stageName').textContent=STAGES[stage].name;
  const n=STAGES[stage+1];
  if(n){$('next').textContent=n.name.toLowerCase()+' a '+n.at;
    $('fill').style.width=((light-STAGES[stage].at)/(n.at-STAGES[stage].at)*100)+'%'}
  else{$('next').textContent='todo despierto';$('fill').style.width='100%'}
  $('hint').textContent=STAGES[stage].hint}
let toastT=0;
function toast(t,p){$('tT').textContent=t;$('tP').textContent=p;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('on'),3800)}
function gain(n){light+=n;const s=stageFor(light);
  if(s>stage){stage=s;toast(STAGES[s].t,STAGES[s].p);chord();spawnStage()}
  hud()}
setInterval(save,3000);addEventListener('pagehide',save);

// ---------- sonido ----------
let ac=null,on=false;
const notes=[220,261.6,293.7,329.6,392,440,523.3,587.3,659.3];
function play(f,vol=.07,dur=3.2,delay=0){if(!on||!ac)return;
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
  o.type='sine';o.frequency.value=f;o2.type='triangle';o2.frequency.value=f*2.002;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const g2=ac.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);
  o.connect(g);g.connect(ac.destination);o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1)}
function tone(y){play(notes[Math.max(0,Math.min(8,Math.floor((1-y/H)*9)))])}
function chord(){[0,2,4,7].forEach((i,k)=>play(notes[i],.05,4.5,k*.18))}
let lastPing=0;function ping(){const n=performance.now();if(n-lastPing<90)return;lastPing=n;play(notes[5+Math.floor(Math.random()*4)]*2,.018,1.2)}
$('snd').onclick=e=>{e.stopPropagation();
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(_){}
  on=!on;e.target.textContent='Sonido: '+(on?'sí':'no')};

// ---------- mundo ----------
const P=[],R=[],M=[],J=[],F=[],S=[];let turtle=null,turtleTimer=600;
const mx=()=>W*.72,my=()=>H*.16;
const N=Math.round(Math.min(240,W*H/3400));
for(let i=0;i<N;i++)P.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-.08,.08),vy:rnd(-.08,.08),g:0,cd:0,r:rnd(.6,2),ph:rnd(0,6.28)});
function addJelly(){J.push({x:rnd(W*.1,W*.9),y:H+40,s:rnd(14,24),ph:rnd(0,6),g:0,cd:0,vy:rnd(.12,.25)})}
function addFish(n){for(let i=0;i<n;i++)F.push({x:rnd(0,W),y:rnd(H*.3,H),vx:rnd(-1,1),vy:rnd(-1,1),g:0,cd:0})}
function spawnStage(){if(stage>=1&&J.length<4)for(let i=J.length;i<4;i++){addJelly();J[J.length-1].y=rnd(H*.4,H+80)}
  if(stage>=2&&F.length===0)addFish(Math.round(Math.min(26,W/16)));}
spawnStage();hud();
if(stage>0)$('intro').style.opacity=.55;

function mote(x,y,v=1){M.push({x,y,vx:rnd(-.6,.6),vy:rnd(-1.4,-.4),v,t:0})}
function drop(x,y,s=1){R.push({x,y,r:0,a:1,s,hit:new Set()});tone(y)}

// input
let hold=null,last=0,downAt=0;
cv.addEventListener('pointerdown',e=>{const x=e.clientX,y=e.clientY;downAt=performance.now();hold={x,y};
  // tocar medusa / tortuga
  for(const j of J)if(Math.hypot(j.x-x,j.y-y)<j.s*1.8&&j.cd<=0){pulseJelly(j);return}
  if(turtle&&!turtle.done&&Math.hypot(turtle.x-x,turtle.y-y)<70){turtle.done=true;turtle.g=1;for(let i=0;i<30;i++)mote(turtle.x+rnd(-30,30),turtle.y+rnd(-20,20),1);chord();return}
  drop(x,y,1);last=downAt});
cv.addEventListener('pointermove',e=>{if(hold){hold.x=e.clientX;hold.y=e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>hold=null));
function pulseJelly(j){j.g=1;j.cd=90;for(let i=0;i<8;i++)mote(j.x+rnd(-10,10),j.y,1);play(notes[2]*.5,.08,2.5);play(notes[6],.03,2)}

// intersecciones de ondas: chispas
function crossings(){for(let i=0;i<R.length;i++)for(let k=i+1;k<R.length;k++){
  const a=R[i],b=R[k],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d<1||d>a.r+b.r||d<Math.abs(a.r-b.r))continue;
  const l=(a.r*a.r-b.r*b.r+d*d)/(2*d),h=Math.sqrt(Math.max(0,a.r*a.r-l*l));
  const px=a.x+dx*l/d,py=a.y+dy*l/d,str=Math.min(a.a,b.a);
  for(const sg of[-1,1]){const sx=px+sg*h*dy/d,sy=py-sg*h*dx/d;
    if(Math.random()<.35*str)S.push({x:sx,y:sy,t:0});
    if(Math.random()<.06*str){mote(sx,sy,1);ping()}}}}

// ---------- dibujo ----------
let hue=0;
function col(a,l=1){ // color del brillo según etapa (aurora gira el tono)
  if(stage<4)return `rgba(${Math.round(126*l)},${Math.round(240*l)},${Math.round(212*l)},${a})`;
  return `hsla(${165+Math.sin(hue)*60},80%,${Math.round(72*l)}%,${a})`}

function frame(t){
  hue+=.0015;
  const bg=cx.createLinearGradient(0,0,0,H);
  if(stage>=4){bg.addColorStop(0,`hsl(${195+Math.sin(hue)*25},70%,10%)`);bg.addColorStop(1,'#020c10')}
  else{bg.addColorStop(0,'#062730');bg.addColorStop(1,'#020c10')}
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  // luna
  const X=mx(),Y=my(),fill=Math.min(1,.4+light/1500*.6);
  const mg=cx.createRadialGradient(X,Y,0,X,Y,Math.max(W,H)*.45);
  mg.addColorStop(0,`rgba(232,226,201,${.06+.08*fill})`);mg.addColorStop(1,'rgba(232,226,201,0)');
  cx.fillStyle=mg;cx.fillRect(0,0,W,H);
  for(let i=0;i<14;i++){const yy=Y+i*16+Math.sin(t/1400+i)*3,w=(40-i*2)*(.6+fill*.6)+Math.sin(t/900+i*2)*8;
    cx.fillStyle=`rgba(232,226,201,${(.07-i*.004)*(.6+fill)})`;cx.fillRect(X-w/2,yy,w,2)}

  if(hold&&t-last>420&&t-downAt>300&&stage<2){drop(hold.x+rnd(-15,15),hold.y+rnd(-15,15),1.3);last=t}
  if(hold&&stage>=2&&t-last>900){drop(hold.x,hold.y,1.2);last=t}

  // ondas
  for(let i=R.length-1;i>=0;i--){const w=R[i];w.r+=(reduce?1.2:1.7)*w.s;w.a=Math.max(0,1-w.r/(280*w.s));
    if(w.a<=0){R.splice(i,1);continue}
    for(let k=0;k<3;k++){const rr=w.r-k*14;if(rr<=0)continue;
      cx.beginPath();cx.arc(w.x,w.y,rr,0,6.283);cx.strokeStyle=col(w.a*(.45-k*.13));cx.lineWidth=1.4-k*.3;cx.stroke()}}
  crossings();

  // chispas
  for(let i=S.length-1;i>=0;i--){const s=S[i];s.t++;if(s.t>30){S.splice(i,1);continue}
    const a=1-s.t/30;cx.fillStyle=col(a*.9,1.15);cx.beginPath();cx.arc(s.x,s.y,1.6+a*1.5,0,6.283);cx.fill()}

  // plancton
  for(const p of P){
    p.ph+=.01;p.x+=p.vx+Math.sin(p.ph)*.08;p.y+=p.vy+Math.cos(p.ph*.7)*.06;
    if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H;
    if(p.cd>0)p.cd--;
    for(const w of R){const dx=p.x-w.x,dy=p.y-w.y,d=Math.hypot(dx,dy);
      if(Math.abs(d-w.r)<10){p.g=Math.min(1,p.g+.5*w.a);if(d>0){p.x+=dx/d*.6*w.a;p.y+=dy/d*.6*w.a}
        if(p.cd===0&&w.a>.3&&Math.random()<.25){mote(p.x,p.y,1);p.cd=240}}}
    p.g*=.975;const rad=p.r+p.g*2.4;
    if(p.g>.05){cx.fillStyle=col(p.g*.16);cx.beginPath();cx.arc(p.x,p.y,rad*4,0,6.283);cx.fill()}
    cx.fillStyle=p.g>.05?col(.2+p.g*.8):`rgba(93,138,138,.22)`;cx.beginPath();cx.arc(p.x,p.y,rad,0,6.283);cx.fill()}

  // medusas
  for(const j of J){j.ph+=.03;const pulse=(Math.sin(j.ph)+1)/2;j.y-=j.vy*(.4+pulse);j.x+=Math.sin(j.ph*.3)*.2;
    if(j.cd>0)j.cd--;
    for(const w of R)if(!w.hit.has(j)&&Math.abs(Math.hypot(j.x-w.x,j.y-w.y)-w.r)<j.s&&j.cd<=0&&w.a>.2){w.hit.add(j);pulseJelly(j)}
    if(j.y<-60){j.y=H+50;j.x=rnd(W*.1,W*.9)}
    j.g*=.97;const s=j.s*(1+pulse*.12),gl=.25+j.g*.75;
    cx.strokeStyle=col(gl*.5);cx.lineWidth=1;
    for(let k=-2;k<=2;k++){cx.beginPath();cx.moveTo(j.x+k*s*.3,j.y);
      for(let q=1;q<=6;q++)cx.lineTo(j.x+k*s*.3+Math.sin(j.ph+q*.7+k)*4,j.y+q*s*.45);cx.stroke()}
    const g=cx.createRadialGradient(j.x,j.y-s*.3,0,j.x,j.y-s*.3,s*2.5);g.addColorStop(0,col(gl*.35));g.addColorStop(1,col(0));
    cx.fillStyle=g;cx.beginPath();cx.arc(j.x,j.y-s*.3,s*2.5,0,6.283);cx.fill();
    cx.fillStyle=col(gl*.55);cx.beginPath();cx.ellipse(j.x,j.y,s,s*(.75-pulse*.12),0,Math.PI,0);cx.fill()}

  // cardumen
  const tx=hold?hold.x:W/2+Math.cos(t/6000)*W*.3,ty=hold?hold.y:H*.6+Math.sin(t/4500)*H*.2;
  let cxm=0,cym=0;for(const f of F){cxm+=f.x;cym+=f.y}cxm/=F.length||1;cym/=F.length||1;
  for(const f of F){
    f.vx+=(tx-f.x)*.0006+(cxm-f.x)*.0004+rnd(-.08,.08);f.vy+=(ty-f.y)*.0006+(cym-f.y)*.0004+rnd(-.08,.08);
    for(const o of F)if(o!==f){const dx=f.x-o.x,dy=f.y-o.y,d=dx*dx+dy*dy;if(d<300&&d>0){f.vx+=dx/d*2;f.vy+=dy/d*2}}
    const sp=Math.hypot(f.vx,f.vy),mxs=hold?2.6:1.4;if(sp>mxs){f.vx*=mxs/sp;f.vy*=mxs/sp}
    f.x+=f.vx;f.y+=f.vy;if(f.cd>0)f.cd--;
    for(const w of R)if(Math.abs(Math.hypot(f.x-w.x,f.y-w.y)-w.r)<8&&w.a>.2){f.g=1;if(f.cd===0){mote(f.x,f.y,1);f.cd=120;ping()}}
    f.g*=.97;const an=Math.atan2(f.vy,f.vx);
    cx.save();cx.translate(f.x,f.y);cx.rotate(an);
    if(f.g>.05){cx.fillStyle=col(f.g*.15);cx.beginPath();cx.arc(0,0,14,0,6.283);cx.fill()}
    cx.fillStyle=f.g>.05?col(.3+f.g*.7):'rgba(140,170,170,.35)';
    cx.beginPath();cx.ellipse(0,0,6,2.2,0,0,6.283);cx.fill();
    cx.beginPath();cx.moveTo(-5,0);cx.lineTo(-10,-3);cx.lineTo(-10,3);cx.fill();cx.restore()}

  // tortuga
  if(stage>=3){if(!turtle){turtleTimer--;if(turtleTimer<=0){const l=Math.random()<.5;
      turtle={x:l?-80:W+80,y:rnd(H*.35,H*.8),dir:l?1:-1,ph:0,g:0,done:false}}}
    else{const T=turtle;T.ph+=.025;T.x+=T.dir*.45;T.y+=Math.sin(T.ph*.5)*.2;T.g*=.985;
      cx.save();cx.translate(T.x,T.y);cx.scale(T.dir,1);
      const gl=T.done?.35+T.g*.65:.35+Math.sin(T.ph*2)*.1;
      if(!T.done){cx.strokeStyle=col(.25+Math.sin(T.ph*2)*.15);cx.lineWidth=1;cx.beginPath();cx.arc(0,0,48+Math.sin(T.ph*2)*4,0,6.283);cx.stroke()}
      cx.fillStyle=col(gl*.5);
      const fl=Math.sin(T.ph)*.5;
      for(const [fx,fy,s] of [[14,-14,1],[14,14,-1]]){cx.save();cx.translate(fx,fy);cx.rotate(s*(.5+fl));cx.beginPath();cx.ellipse(8,0,16,5,0,0,6.283);cx.fill();cx.restore()}
      for(const [fx,fy,s] of [[-16,-11,1],[-16,11,-1]]){cx.save();cx.translate(fx,fy);cx.rotate(s*(-.4-fl*.5));cx.beginPath();cx.ellipse(-4,0,8,3.5,0,0,6.283);cx.fill();cx.restore()}
      cx.beginPath();cx.ellipse(28,0,8,6,0,0,6.283);cx.fill();
      cx.fillStyle=col(gl*.75);cx.beginPath();cx.ellipse(0,0,24,17,0,0,6.283);cx.fill();
      cx.strokeStyle=col(gl);cx.lineWidth=1;cx.beginPath();
      cx.moveTo(-10,-12);cx.lineTo(-10,12);cx.moveTo(6,-14);cx.lineTo(6,14);cx.moveTo(-22,0);cx.lineTo(22,0);cx.stroke();
      cx.restore();
      if(T.x<-120||T.x>W+120){turtle=null;turtleTimer=rnd(900,1600)}}}

  // motas de luz: suben hacia la luna
  for(let i=M.length-1;i>=0;i--){const m=M[i];m.t++;
    const dx=X-m.x,dy=Y-m.y,d=Math.hypot(dx,dy);
    const pull=Math.min(1,m.t/60)*.18;m.vx=m.vx*.96+dx/d*pull;m.vy=m.vy*.96+dy/d*pull;m.x+=m.vx;m.y+=m.vy;
    if(d<14){M.splice(i,1);gain(m.v);continue}
    cx.fillStyle=col(.18,1.1);cx.beginPath();cx.arc(m.x,m.y,5,0,6.283);cx.fill();
    cx.fillStyle='rgba(240,250,235,.9)';cx.beginPath();cx.arc(m.x,m.y,1.5,0,6.283);cx.fill()}

  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>

</body></html>
