<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a1f36">
<title>El inconsciente</title>
<style>
  :root { --fondo: #1d1626; --texto: #fff6ea; --suave: #d9c8d8; --acento: #ffd9a0; --borde: rgba(255,255,255,.18) }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto); font: 18px/1.5 Georgia, "Times New Roman", serif; -webkit-user-select: none; user-select: none; touch-action: none }
  #app canvas { display: block; position: fixed; inset: 0 }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
  .pantalla { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center; padding: 24px 16px; background: radial-gradient(ellipse at center, rgba(29,22,38,.15), rgba(29,22,38,.75)); overflow-y: auto }
  .pantalla[hidden] { display: none }
  h1 { font-size: clamp(34px, 8vw, 64px); font-weight: 400; font-style: italic; margin: 0 0 6px; letter-spacing: .5px; text-shadow: 0 0 30px rgba(255,200,220,.6) }
  h2 { font-weight: 400; font-style: italic; font-size: 28px; margin: 0 0 12px }
  .bajada { color: var(--suave); max-width: 30em; margin: 0 0 26px }
  #version { color: var(--suave); font-size: 14px; opacity: .7; margin-bottom: 18px }
  .grande { background: rgba(255,240,220,.92); color: #2a1f36; font-size: 21px; border-radius: 40px; padding: 14px 34px; margin: 6px; box-shadow: 0 0 40px rgba(255,210,180,.45) }
  .suave { color: var(--suave); text-decoration: underline; padding: 12px; font-size: 16px }
  .acciones { display: flex; flex-wrap: wrap; justify-content: center; align-items: center }
  #probar { justify-content: flex-start; background: rgba(29,22,38,.92) }
  #probar ol { text-align: left; max-width: 34em; padding-left: 1.4em; margin: 0 0 14px }
  #probar li { margin-bottom: 10px }
  #suenos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; margin: 0 0 18px }
  #suenos button { text-align: left; border: 1px solid var(--borde); border-radius: 16px; padding: 12px 14px; background: rgba(29,22,38,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px) }
  #suenos button b { display: block; font-weight: 400; font-style: italic; font-size: 21px }
  #suenos button span { display: block; color: var(--suave); font-size: 14px; line-height: 1.35; margin-top: 2px }
  #suenos button.elegido { border-color: var(--acento); background: rgba(255,217,160,.18); box-shadow: 0 0 24px rgba(255,217,160,.35) }
  @media (max-width: 420px) { #suenos button span { font-size: 13px } #suenos button b { font-size: 19px } .bajada { margin-bottom: 14px } h1 { margin-top: 8px } }
  .criterio { color: var(--acento); font-style: italic; max-width: 30em }
  #final-datos p { margin: 4px 0 }
  #final-datos b { color: var(--acento); font-weight: 400; font-size: 1.2em }
  #frase { position: fixed; left: 16px; right: 16px; top: 38%; z-index: 10; text-align: center; font-size: clamp(22px, 4.2vw, 34px); font-style: italic; text-shadow: 0 0 18px rgba(40,20,50,.9), 0 0 4px rgba(40,20,50,.9); pointer-events: none; opacity: 0 }
  #frase .sub { font-size: .62em; font-style: normal; color: var(--suave); margin-top: 8px }
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 12; display: flex; align-items: center; gap: 14px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); font-size: 16px; font-style: italic; text-shadow: 0 0 8px rgba(0,0,0,.6); pointer-events: none }
  #hud .puntos { display: flex; gap: 6px }
  #hud i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--texto); opacity: .7 }
  #hud i.si { background: var(--acento); border-color: var(--acento); box-shadow: 0 0 10px var(--acento); opacity: 1 }
  #hud button { margin-left: auto; pointer-events: auto; font-size: 20px; padding: 4px 8px }
  #ayuda { position: fixed; bottom: 18px; left: 16px; right: 16px; z-index: 12; text-align: center; color: var(--suave); font-size: 15px; transition: opacity 2s; pointer-events: none; padding-bottom: env(safe-area-inset-bottom) }
  #ayuda.fuera { opacity: 0 }
  .pista { position: fixed; top: 0; bottom: 0; width: 22vw; max-width: 160px; z-index: 9; pointer-events: none; opacity: 0 }
  #pista-iz { left: 0; background: linear-gradient(90deg, rgba(255,240,200,.45), rgba(255,240,200,0)) }
  #pista-de { right: 0; background: linear-gradient(270deg, rgba(255,240,200,.45), rgba(255,240,200,0)) }
  #toque { position: fixed; inset: 0; z-index: 8 }
  #palanca { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); z-index: 11; pointer-events: none }
  #perilla { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35) }
  #error { position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 30; background: #3a1d2a; border: 1px solid #ff8fa0; border-radius: 12px; padding: 10px 14px; font-family: system-ui, sans-serif; font-size: 15px }
</style>
</head>
<body>
<div id="app"></div>
<div id="frase"></div>
<div id="hud" hidden></div>
<div id="ayuda" hidden></div>
<div class="pista" id="pista-iz"></div>
<div class="pista" id="pista-de"></div>
<div id="toque" hidden></div>
<div id="palanca" hidden><div id="perilla"></div></div>

<section class="pantalla" id="portada">
  <h1>El inconsciente</h1>
  <div id="version"></div>
  <p class="bajada">Estás soñando. Lo que no mirás, cambia. Seguí la campanita y juntá lo que quedó adentro. Mejor con auriculares. Elegí qué soñar:</p>
  <div id="suenos"></div>
  <div class="acciones">
    <button class="grande" id="entrar">Entrar al sueño</button>
    <button class="grande" id="visor" hidden>Entrar con el visor</button>
  </div>
  <button class="suave" data-probar>Qué probar</button>
</section>

<section class="pantalla" id="pausa" hidden>
  <h2>El sueño espera</h2>
  <div class="acciones"><button class="grande" id="seguir">Seguir soñando</button></div>
  <button class="suave" data-probar>Qué probar</button>
</section>

<section class="pantalla" id="final" hidden>
  <h1>Despertás.</h1>
  <div id="final-datos"></div>
  <div class="acciones"><button class="grande" id="otra">Volver a soñar</button><button class="grande" id="otro">Otro sueño</button></div>
  <button class="suave" data-probar>Qué probar</button>
</section>

<section class="pantalla" id="probar" hidden></section>
<div id="error" hidden></div>
