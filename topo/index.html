<style>
  /* Cabina de noche: pantallas de aviónica (ámbar = acción, cian = la IA, magenta = la ruta, como en un panel real). Una sola paleta oscura, a propósito. */
  :root { color-scheme: dark;
    color-scheme: dark;
    --fondo: #0b1317; --pantalla: #101c22; --marco: #1f323b; --texto: #d8e5e9; --suave: #7d959f;

    --display: "Chakra Petch", "Bahnschrift", "DIN Alternate", system-ui, sans-serif;
    --cuerpo: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --datos: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.45 var(--cuerpo); -webkit-tap-highlight-color: transparent }
  body { min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation }
  button:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px }
  button:disabled { cursor: default; opacity: .45 }
  [hidden] { display: none !important }
  .envase { max-width: 1180px; margin: 0 auto }
  .etiqueta { font: 600 11px/1 var(--datos); letter-spacing: .12em; text-transform: uppercase; color: var(--suave) }
  .num { font-family: var(--datos); font-variant-numeric: tabular-nums }

  /* inicio */
  .inicio { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; padding-top: 12px }
  .titulo { font: 700 clamp(40px, 11vw, 64px)/0.95 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance }
  .titulo span { color: var(--ambar) }
  .historia { margin: 0; color: var(--texto); max-width: 60ch }
  .historia em { color: var(--cian); font-style: normal }
  .vuelos { display: grid; gap: 10px }
  .amenazas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
  .amenazas .etiqueta { width: 100% }
  .chipbtn { background: var(--pantalla); border: 1px solid var(--marco); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--cuerpo) }
  .chipbtn[aria-pressed="true"] { border-color: var(--ambar); color: var(--ambar) }
  .vuelo { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; background: var(--pantalla); border: 1px solid var(--marco); border-radius: 10px; padding: 14px 16px }
  .vuelo:hover { border-color: var(--ambar) }
  .vuelo .cod { font: 600 13px/1.2 var(--datos); color: var(--magenta) }
  .vuelo b { display: block; font: 700 18px/1.2 var(--display) }
  .vuelo small { color: var(--suave) }
  .vuelo .hecho { font: 600 12px var(--datos); color: var(--bien) }
  .reglas { margin: 0; padding-left: 18px; color: var(--suave); font-size: 15px; display: grid; gap: 4px }
  .numeros { color: var(--suave); font-size: 13px; text-align: center }

  /* cabecera de vuelo */
  .cabecera { display: grid; gap: 8px; padding: 10px 14px; background: var(--pantalla); border: 1px solid var(--marco); border-radius: 10px }
  .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap }
  .ruta { font: 600 14px var(--datos); color: var(--magenta) }
  .reloj { font: 700 22px/1 var(--display); color: var(--ambar) }
  .reloj.poco { color: var(--mal) }
  .traza { position: relative; height: 14px }
  .traza::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; border-top: 2px dashed var(--marco) }
  .traza .hecha { position: absolute; left: 0; top: 6px; border-top: 2px solid var(--magenta); transition: width .6s ease }
  .traza .avion { position: absolute; top: -3px; transform: translateX(-50%); font-size: 16px; line-height: 1; color: var(--texto); transition: left .6s ease }
  .transmision { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-left: 2px solid var(--cian); background: color-mix(in srgb, var(--cian) 7%, transparent); border-radius: 0 8px 8px 0; font-size: 14px; min-height: 40px }
  .transmision .quien { font: 600 11px/1.9 var(--datos); color: var(--cian); letter-spacing: .1em; flex: none }

  /* pestañas (solo en celu) y las tres pantallas */

  .pestanas .aviso { color: var(--cian) }

  .pantalla h2 { margin: 0; font: 700 17px/1.2 var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
  .pantalla h2 .etiqueta { font-size: 10px }
  .ayuda { margin: 0; color: var(--suave); font-size: 14px }

  .accion.peligro { border-color: var(--mal); color: var(--mal) }
  .accion.peligro.seguro { background: var(--mal); color: var(--fondo) }

  .agentes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 10px }
  .agente { border: 1px solid var(--marco); border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 0 }
  .agente.descartado { opacity: .42 }
  .agente.descartado .nombre { text-decoration: line-through }
  .agente.coincide { border-color: var(--ambar) }
  .agente .cab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
  .agente .nombre { font-weight: 600 }
  .agente .rol { color: var(--suave); font-size: 13px }
  .marca { font: 600 10px var(--datos); letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; flex: none }
  .marca.coincide { background: var(--ambar); color: var(--fondo) }
  .marca.descartado { color: var(--suave) }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 4px }
  .chip { font: 400 12px/1.3 var(--datos); padding: 4px 6px; border-radius: 4px; background: var(--fondo); border: 1px solid var(--marco); overflow-wrap: anywhere }
  .chip i { font-style: normal; color: var(--suave); display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase }
  .chip.si { border-color: var(--bien); color: var(--bien) }
  .chip.no { border-color: color-mix(in srgb, var(--mal) 60%, transparent); color: var(--mal) }
  .agente .botones { display: flex; gap: 6px; flex-wrap: wrap }
  .agente .botones .accion { flex: 1; padding: 6px 8px; font-size: 12px }

  .bitacora { display: grid; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 4px }
  .msg { font-size: 14px; padding: 8px 10px; border-radius: 6px; background: var(--fondo); border-left: 2px solid var(--cian) }
  .msg.alerta { border-left-color: var(--mal) }
  .msg .hora { font: 600 11px var(--datos); color: var(--suave); display: block }

  .nw { white-space: nowrap }

  .cruces { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }

  .cruzar-tit { margin: 0 }

  .final.perdio h2 { color: var(--mal) }

  .botonera { display: flex; gap: 10px; flex-wrap: wrap }
  .grande { flex: 1; min-width: 140px; padding: 14px; border-radius: 10px; font: 700 18px var(--display); background: var(--ambar); color: var(--fondo); border: 0 }
  .grande.sec { background: transparent; color: var(--texto); border: 1px solid var(--marco) }

  @media (max-width: 900px) {
    .pestanas { display: flex }
    .panel { grid-template-columns: minmax(0, 1fr) }

  }
  @media (prefers-reduced-motion: reduce) {
    .traza .hecha, .traza .avion { transition: none }
    .enlace .etiqueta.ocupado { animation: none }
    .barra i { transition: none }
  }
</style>
