<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1a17">
<title>¡Fuera palomas!</title>
<style>
  :root { --fondo: #1b1a17; --tarjeta: #2a2824; --borde: #3d3a34; --texto: #f2ede3; --suave: #b3ab9c; --acento: #f2b33d; --mal: #ff4d3d }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 20px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
  button { font: inherit; color: inherit; cursor: pointer; border: 0 }
  .pantalla { max-width: 680px; margin: 0 auto; padding: 16px; text-align: center }
  .version { display: inline-block; background: #2f6fe0; color: #fff; font-weight: 800; font-size: 22px; border-radius: 10px; padding: 4px 14px; margin: 8px 0 0 }
  .titulo { font-size: 48px; font-weight: 900; letter-spacing: -1px; margin: 12px 0 4px; color: var(--acento) }
  .bajada { color: var(--suave); margin: 0 0 22px }
  .grande { display: block; width: 100%; background: var(--acento); color: var(--fondo); font-weight: 900; font-size: 30px; border-radius: 18px; padding: 26px 20px }
  .grande:disabled { background: var(--borde); color: var(--suave); cursor: default }
  .nota { color: var(--suave); font-size: 17px; margin: 10px 0 18px }
  .chico { background: var(--tarjeta); border: 2px solid var(--borde); color: var(--texto); font-weight: 700; border-radius: 14px; padding: 14px 26px }
  .ayuda { text-align: left; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 16px; padding: 14px 18px; margin: 26px 0 }
  .ayuda ul { margin: 8px 0 0; padding-left: 22px; color: var(--suave) }
  .ayuda li { margin: 4px 0 }
  .error { background: #3a1d1a; border: 2px solid var(--mal); border-radius: 12px; padding: 10px 14px; margin: 16px }
  .seccion { background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 18px; padding: 14px 16px 18px; margin: 16px 0 }
  .seccion h2 { margin: 0 0 6px; font-size: 28px; color: var(--texto) }
  .seccion .bajada { margin: 0 0 12px }
  .seccion .chico { margin-top: 12px }
  .vista video { width: 100%; max-height: 260px; object-fit: contain; background: #000; border-radius: 12px }
  .camara { position: fixed; inset: 0; background: #000; z-index: 20 }
  .camara video, .camara canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain }
  .camara canvas { touch-action: none }
  .hud-cam { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(27,26,23,.8) }
  .hud-cam .info { flex: 1; text-align: center; font-weight: 800; font-size: 20px; color: var(--acento); white-space: pre }
  .btn-cam { background: var(--boton, #3a372f); border: 2px solid var(--borde); border-radius: 12px; padding: 10px 16px; font-weight: 800; min-width: 84px }
  .pie-cam { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 14px; text-align: center; background: rgba(27,26,23,.8); color: var(--suave); font-size: 17px }
  .cartel-cam { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); background: rgba(27,26,23,.95); border: 2px solid var(--borde); border-radius: 18px; padding: 18px; text-align: center }
  .cartel-cam .tit { font-size: 34px; font-weight: 900 }
  .cartel-cam p { margin: 8px 0; color: var(--texto) }
  .cartel-cam .fila { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 12px }
  .cartel-cam .grande { width: auto; padding: 16px 34px; font-size: 24px }
  .vr { position: fixed; inset: 0; z-index: 30; background: #24221e }
  .vr canvas { display: block }
</style>
</head>
