<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1a17">
<title>¡Fuera palomas!</title>
<style>
  :root { --fondo: #1b1a17; --tarjeta: #2a2824; --borde: #3d3a34; --texto: #f2ede3; --suave: #b3ab9c; --acento: #f2b33d; --mal: #ff4d3d }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 20px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
  button { font: inherit; color: inherit; cursor: pointer; border: 0 }
  .pantalla { max-width: 680px; margin: 0 auto; padding: 16px; text-align: center }
  .version { display: inline-block; background: #2f6fe0; color: #fff; font-weight: 800; font-size: 22px; border-radius: 10px; padding: 4px 14px; margin: 8px 0 0 }
  .titulo { font-size: 48px; font-weight: 900; letter-spacing: -1px; margin: 12px 0 4px; color: var(--acento) }
  .bajada { color: var(--suave); margin: 0 0 22px }
  .grande { display: block; width: 100%; background: var(--acento); color: var(--fondo); font-weight: 900; font-size: 30px; border-radius: 18px; padding: 26px 20px }
  .grande:disabled { background: var(--borde); color: var(--suave); cursor: default }
  .nota { color: var(--suave); font-size: 17px; margin: 10px 0 18px }
  .chico { background: var(--tarjeta); border: 2px solid var(--borde); color: var(--texto); font-weight: 700; border-radius: 14px; padding: 14px 26px }
  .ayuda { text-align: left; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 16px; padding: 14px 18px; margin: 26px 0 }
  .ayuda ul { margin: 8px 0 0; padding-left: 22px; color: var(--suave) }
  .ayuda li { margin: 4px 0 }
  .error { background: #3a1d1a; border: 2px solid var(--mal); border-radius: 12px; padding: 10px 14px; margin: 16px }
  .vr { position: fixed; inset: 0; z-index: 30; background: #24221e }
  .vr canvas { display: block }
</style>
</head>
